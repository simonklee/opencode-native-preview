name: cli-rs release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, container: "rockylinux:8" }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, container: "rockylinux:8" }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, zig: x86_64-linux-gnu.2.17, zig_sha: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, zig: aarch64-linux-gnu.2.17, zig_sha: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/cli-rs
    env:
      OPENCODE_NATIVE_COMMIT: ${{ github.sha }}
      CARGO_PROFILE_DIST_STRIP: symbols
    steps:
      # The container has no compiler, git or rustup.
      - if: matrix.container
        working-directory: .
        run: |
          dnf -y -q install gcc gcc-c++ git unzip xz
          curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: anomalyco/opencode
          ref: 22d022cb13b66f7f44f0b6e151f447c83bbf5b15
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Zig compiles the C and C++ and links against glibc 2.17's symbols.
      - if: matrix.zig
        working-directory: ${{ runner.temp }}
        run: |
          file=zig-$(uname -m)-linux-0.17.1
          curl -fsSL "https://ziglang.org/download/0.17.1/$file.tar.xz" -o zig.tar.xz
          echo "${{ matrix.zig_sha }}  zig.tar.xz" | sha256sum -c
          tar -xJf zig.tar.xz
          for tool in cc c++; do
            printf '#!/bin/sh\nfor a; do shift; case $a in --target=*) ;; *) set -- "$@" "$a" ;; esac; done\nexec %s %s -target %s "$@"\n' "$PWD/$file/zig" "$tool" "${{ matrix.zig }}" > "zig-$tool"
            chmod +x "zig-$tool"
          done
          { echo "CC=$PWD/zig-cc"; echo "CXX=$PWD/zig-c++"; echo "CXXSTDLIB=c++"; echo "RUSTFLAGS=-C linker=$PWD/zig-cc"; } >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - name: Build
        run: |
          start=$SECONDS
          bun run cargo build --locked --profile dist --bin opencode-native
          echo "build: $((SECONDS - start)) s"
      - name: Floor
        run: |
          bin=target/dist/opencode-native
          echo "highest GLIBC: $(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          echo "highest GLIBCXX: $(objdump -T "$bin" | grep -oE 'GLIBCXX_[0-9.]+' | sort -Vu | tail -1)"
          objdump -p "$bin" | grep NEEDED
          ls -l "$bin"
          "$bin" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-native-${{ matrix.target }}-${{ matrix.container && 'rocky8' || 'zig' }}
          path: packages/cli-rs/target/dist/opencode-native
          if-no-files-found: error
