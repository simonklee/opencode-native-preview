name: build

# Builds opencode-native, the OpenCode native CLI (packages/cli-rs of anomalyco/opencode), at `ref` for each preview
# platform and
# publishes one prerelease per build. The nightly run skips when `oc-rust` has not moved since the
# last release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of anomalyco/opencode
        default: oc-rust
        required: true

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  ZIG_VERSION: "0.17.0"
  BUN_VERSION: "1.4.1"
  # The oldest TypeScript CLI the client is tested against (share-builds.md 1.2).
  OPENCODE_TS_MIN: "2.2.7"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      dev_base: ${{ steps.plan.outputs.dev_base }}
      opentui_rev: ${{ steps.plan.outputs.opentui_rev }}
      header_fnv1a64: ${{ steps.plan.outputs.header_fnv1a64 }}
      skip: ${{ steps.plan.outputs.skip }}
      bin: ${{ steps.plan.outputs.bin }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          REF: ${{ inputs.ref || 'oc-rust' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q src && cd src
          git remote add origin https://github.com/anomalyco/opencode
          git fetch -q --filter=tree:0 origin "$REF"
          commit=$(git rev-parse FETCH_HEAD)
          git fetch -q --filter=tree:0 origin dev:refs/remotes/origin/dev
          dev_base=$(git merge-base "$commit" origin/dev)
          rev=$(git show "$commit:packages/cli-rs/Cargo.toml" | sed -nE 's/^opentui *= *\{.*rev *= *"([0-9a-f]{40})".*/\1/p')
          test -n "$rev"
          hash=$(curl -fsSL "https://raw.githubusercontent.com/anomalyco/opentui/$rev/packages/rust/crates/opentui-sys/src/generated.rs" \
            | sed -nE 's/.*OPENTUI_HEADER_FNV1A64: u64 = (0x[0-9a-f_]+);.*/\1/p' | tr -d _)
          test -n "$hash"
          # The Cargo name of the client binary: opencode-rs before the rename (O-114), opencode-native after.
          # Every archive ships it as opencode-native. Drop this once a release has been built from the new name.
          bin=$(git show "$commit:packages/cli-rs/crates/cli/Cargo.toml" | awk '
            /^\[\[bin\]\]/ { inbin = 1; name = ""; next }
            /^\[/ { inbin = 0 }
            inbin && /^name *=/ { name = $0; sub(/^name *= *"/, "", name); sub(/".*/, "", name) }
            inbin && /^path *= *"src\/main\.rs"/ { print name; exit }')
          # The version prefix follows the name: a pre-rename client recognizes only 0.0.0-rs-<run> as a preview, and
          # its `upgrade` then points at the install script instead of updating the TypeScript CLI.
          case $bin in
            opencode-rs) version=0.0.0-rs-$GITHUB_RUN_NUMBER ;;
            opencode-native) version=0.0.0-native-$GITHUB_RUN_NUMBER ;;
            *) echo "unexpected client binary name '$bin'"; exit 1 ;;
          esac
          skip=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [ -n "$last" ]; then
              built=$(gh release download "$last" -R "$GITHUB_REPOSITORY" -p manifest.json -O - | jq -r .opencode.commit)
              [ "$built" = "$commit" ] && skip=true
            fi
          fi
          {
            echo "commit=$commit"
            echo "dev_base=$dev_base"
            echo "opentui_rev=$rev"
            echo "header_fnv1a64=$hash"
            echo "skip=$skip"
            echo "bin=$bin"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"
          echo "$REF -> $commit (dev base $dev_base), OpenTUI $rev ($hash), binary $bin, version $version, skip=$skip" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            lto: fat
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            lto: fat
          - target: aarch64-apple-darwin
            os: macos-15
            lto: fat
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      TARGET: ${{ matrix.target }}
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          # Everything the build reads: the package, and the attention sounds tui includes from packages/ui.
          sparse-checkout: |
            packages/cli-rs
            packages/ui/src/assets/audio

      - id: native-cache
        uses: actions/cache@v4
        with:
          path: native
          key: opentui-native-${{ needs.plan.outputs.opentui_rev }}-${{ matrix.target }}-v1
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: OpenTUI native library
        run: scripts/opentui-native.sh "$TARGET" native && cat native/STAMP

      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencode/packages/cli-rs -> target
          key: ${{ matrix.target }}-dist
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}

      - name: Build
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}/native
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          # The client reads OPENCODE_NATIVE_COMMIT since the rename and OPENCODE_RS_COMMIT before it.
          OPENCODE_NATIVE_COMMIT: ${{ needs.plan.outputs.commit }}
          OPENCODE_RS_COMMIT: ${{ needs.plan.outputs.commit }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CARGO_PROFILE_DIST_LTO: ${{ matrix.lto }}
          # rustc runs dsymutil, so the debug information outlives the deleted object files.
          CARGO_PROFILE_DIST_SPLIT_DEBUGINFO: ${{ runner.os == 'macOS' && 'packed' || 'off' }}
        run: |
          start=$(date +%s)
          cargo build --locked --profile dist --target "$TARGET" --bin "$BIN"
          echo "build: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Strip
        run: |
          set -euo pipefail
          mkdir -p stage debug
          bin=opencode/packages/cli-rs/target/$TARGET/dist/$BIN
          cp "$bin" stage/opencode-native
          if [ "$RUNNER_OS" = macOS ]; then
            # Cargo's $BIN.dSYM is a symlink into deps/; copy the bundle it points at.
            cp -RL "$bin.dSYM" debug/opencode-native.dSYM
            strip stage/opencode-native
            # strip invalidates the linker's ad-hoc signature; arm64 macOS runs only signed code.
            codesign --force --sign - stage/opencode-native
          else
            objcopy --only-keep-debug stage/opencode-native debug/opencode-native.debug
            strip --strip-all stage/opencode-native
            objcopy --add-gnu-debuglink=debug/opencode-native.debug stage/opencode-native
            echo "highest GLIBC: $(objdump -T stage/opencode-native | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          ls -l "$bin" stage/opencode-native | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          set -euo pipefail
          out=$(stage/opencode-native --version)
          echo "$out"
          case $out in *"$VERSION"*) ;; *) echo "--version printed '$out', not $VERSION"; exit 1 ;; esac
          npm install -g "@opencode/cli@latest" >/dev/null
          echo "TypeScript CLI: $(opencode --version)"
          export HOME=$RUNNER_TEMP/home XDG_CONFIG_HOME=$RUNNER_TEMP/home/.config XDG_DATA_HOME=$RUNNER_TEMP/home/.local/share \
            XDG_STATE_HOME=$RUNNER_TEMP/home/.local/state XDG_CACHE_HOME=$RUNNER_TEMP/home/.cache
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME"
          cd "$RUNNER_TEMP"
          stage=$GITHUB_WORKSPACE/stage/opencode-native
          # JSON, so an empty list still proves the service answered: the table prints nothing for none.
          "$stage" session list --format json > session-list.txt 2>&1 &
          pid=$!
          ( sleep 180; kill "$pid" 2>/dev/null ) &
          status=0
          wait "$pid" || status=$?
          cat session-list.txt
          pkill -f 'serve --service' || true
          if [ "$status" -ne 0 ]; then
            echo "session list exited $status"
            find "$HOME" -name '*.log' -exec sh -c 'echo "== $1"; tail -n 60 "$1"' _ {} \;
            exit 1
          fi
          python3 -I -c 'import json, sys; assert isinstance(json.load(open(sys.argv[1])), list)' session-list.txt

      - name: Package
        run: |
          set -euo pipefail
          cp opencode/LICENSE stage/
          name=opencode-native-$VERSION-$TARGET
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C stage opencode-native LICENSE
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.target }}
          path: debug/
          retention-days: 90
          if-no-files-found: error

  # FFmpeg does not build on Windows hosts, so the Windows library is cross-built here.
  native-windows:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          sparse-checkout: packages/cli-rs
      - id: native-cache
        uses: actions/cache@v4
        with:
          path: native
          key: opentui-native-${{ needs.plan.outputs.opentui_rev }}-x86_64-pc-windows-msvc-v1
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: steps.native-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: scripts/opentui-native.sh "$TARGET" native && cat native/STAMP
      - uses: actions/upload-artifact@v4
        with:
          name: native-x86_64-pc-windows-msvc
          path: native/
          if-no-files-found: error

  # The Windows build and its smoke tests (W10). The job may fail and stays out of the release until W12: its
  # artifacts are named windows-*, which the release's dist-* pattern does not match.
  windows:
    needs: [plan, native-windows]
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 150
    env:
      TARGET: x86_64-pc-windows-msvc
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          sparse-checkout: |
            packages/cli-rs
            packages/ui/src/assets/audio
      - uses: actions/download-artifact@v5
        with:
          name: native-x86_64-pc-windows-msvc
          path: native
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencode/packages/cli-rs -> target
          key: ${{ env.TARGET }}-dist
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}\native
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_NATIVE_COMMIT: ${{ needs.plan.outputs.commit }}
          OPENCODE_RS_COMMIT: ${{ needs.plan.outputs.commit }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --profile dist --target "$TARGET" --bin "$BIN"
      - name: Package and smoke test
        id: package
        run: |
          set -euo pipefail
          mkdir -p stage dist debug
          cp "opencode/packages/cli-rs/target/$TARGET/dist/$BIN.exe" stage/opencode-native.exe
          cp native/opentui.dll opencode/LICENSE stage/
          cp "opencode/packages/cli-rs/target/$TARGET/dist/${BIN//-/_}.pdb" debug/opencode_native.pdb || true
          out=$(stage/opencode-native.exe --version)
          echo "$out"
          case $out in *"$VERSION"*) ;; *) echo "--version printed '$out', not $VERSION"; exit 1 ;; esac
          (cd stage && 7z a -tzip "../dist/opencode-native-$VERSION-$TARGET.zip" opencode-native.exe opentui.dll LICENSE >/dev/null)
          ls -l stage dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist-${{ env.TARGET }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-debug-${{ env.TARGET }}
          path: debug/
          retention-days: 90

      - name: Smoke 1 - version (pwsh)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & stage\opencode-native.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          "$out"
          if ("$out" -notlike "*$env:VERSION*") { throw "--version printed '$out', not $env:VERSION" }

      - name: Smoke 2 - dependents are system DLLs and opentui.dll (+crt-static)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $text = & $dumpbin /nologo /dependents stage\opencode-native.exe
          $text
          $deps = $text | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLowerInvariant() }
          if (-not ($deps -contains 'opentui.dll')) { throw 'opentui.dll is not a dependent' }
          $crt = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
          if ($crt) { throw "dynamic CRT imports (no +crt-static?): $($crt -join ', ')" }
          $system = "$env:SystemRoot\System32"
          $other = $deps | Where-Object {
            $_ -ne 'opentui.dll' -and $_ -notmatch '^(api|ext)-ms-win-' -and -not (Test-Path (Join-Path $system $_))
          }
          if ($other) { throw "non-system dependents: $($other -join ', ')" }
          "dependents: $($deps -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Smoke 3 - without opentui.dll the loader fails with 0xC0000135
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'no-dll'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item stage\opencode-native.exe $dir
          # PATH without native\ or stage\, so no other opentui.dll is found.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath (Join-Path $dir 'opencode-native.exe') -ArgumentList '--version' `
            -WorkingDirectory $dir -NoNewWindow -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'hung without opentui.dll' }
          $code = '{0:X8}' -f $p.ExitCode
          "exit 0x$code"
          if ($code -ne 'C0000135') { throw "expected 0xC0000135 (STATUS_DLL_NOT_FOUND), got 0x$code" }

      - name: Smoke 4 - TS opencode, session list, service stop (W5)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install -g "@opencode/cli@latest" | Out-Null
          "TypeScript CLI: $(opencode --version)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "where opencode: $((where.exe opencode) -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $root = Join-Path $env:RUNNER_TEMP 'home'
          $env:USERPROFILE = $root
          $env:HOME = $root
          $env:XDG_CONFIG_HOME = "$root\.config"
          $env:XDG_DATA_HOME = "$root\.local\share"
          $env:XDG_STATE_HOME = "$root\.local\state"
          $env:XDG_CACHE_HOME = "$root\.cache"
          foreach ($d in $env:XDG_CONFIG_HOME, $env:XDG_DATA_HOME, $env:XDG_STATE_HOME, $env:XDG_CACHE_HOME) {
            New-Item -ItemType Directory -Force $d | Out-Null
          }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'stage\opencode-native.exe'
          Set-Location $env:RUNNER_TEMP
          function Invoke-Bounded([string[]] $arguments, [string] $name) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$name timed out" }
            # Out-Host, so the output is not part of the function's return value.
            Get-Content "$name.out", "$name.err" | Out-Host
            return $p.ExitCode
          }
          # First: does the client find the npm-installed opencode on PATH (an opencode.cmd shim on Windows)?
          $code = Invoke-Bounded @('session', 'list', '--format', 'json') 'path-lookup'
          $pathLookup = $code -eq 0
          "finds opencode on PATH: $pathLookup (exit $code)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' } |
            ForEach-Object { Stop-Process -Force -Id $_.ProcessId -ErrorAction SilentlyContinue }
          if (-not $pathLookup) {
            # Go on with the package's own binary, so session list and service stop are still checked.
            $env:OPENCODE_TS_BIN = Join-Path (npm root -g) '@opencode\cli\bin\opencode.exe'
            "OPENCODE_TS_BIN=$env:OPENCODE_TS_BIN ($(& $env:OPENCODE_TS_BIN --version))" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          try {
            # JSON, so an empty list still proves the service answered.
            $code = Invoke-Bounded @('session', 'list', '--format', 'json') 'session-list'
            if ($code -ne 0) { throw "session list exited $code" }
            $list = Get-Content -Raw session-list.out | ConvertFrom-Json -NoEnumerate
            if ($list -isnot [array]) { throw 'session list did not print a JSON array' }
            # The registration is in the state directory; <config>\opencode\service.json holds the service's settings
            # (hostname, port, password) and stays.
            $registered = Get-ChildItem -Recurse -Filter 'service*.json' $env:XDG_STATE_HOME
            "registered: $($registered.FullName -join ', ')"
            if (-not $registered) { throw 'no service*.json after session list' }
            $code = Invoke-Bounded @('service', 'stop') 'service-stop'
            if ($code -ne 0) { throw "service stop exited $code" }
            Start-Sleep -Seconds 2
            $left = Get-ChildItem -Recurse -Filter 'service*.json' $env:XDG_STATE_HOME
            if ($left) { throw "service*.json still there after service stop: $($left.FullName -join ', ')" }
            $alive = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' }
            if ($alive) { throw "service still running: $($alive.ProcessId -join ', ')" }
            if (-not $pathLookup) { throw 'the client did not find opencode on PATH (npm installs opencode.cmd); the rest passed with OPENCODE_TS_BIN' }
          } catch {
            Get-ChildItem -Recurse -Filter '*.log' $root | ForEach-Object { "== $($_.FullName)"; Get-Content -Tail 60 $_ }
            throw
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' } |
              ForEach-Object { Stop-Process -Force -Id $_.ProcessId -ErrorAction SilentlyContinue }
          }

      - name: Smoke 5 - TUI and prompts on a pseudoconsole (W10)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}\native
          RUSTFLAGS: -C target-feature=+crt-static
          OPENCODE_SMOKE_OUT: ${{ runner.temp }}\smoke
        run: |
          $ErrorActionPreference = 'Stop'
          # The test lands with W10; commits before it (the pushed oc-rust today) have nothing to run.
          if (-not (Test-Path crates\cli\tests\windows_smoke.rs)) {
            'windows_smoke.rs is not in this commit; skipped' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $env:PATH = "$env:OPENTUI_LIB_DIR;$env:PATH"
          cargo test --locked --target $env:TARGET -p opencode-cli --test windows_smoke -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "windows_smoke failed ($LASTEXITCODE)" }

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-c.p
          path: ${{ runner.temp }}\smoke
          if-no-files-found: ignore

  release:
    needs: [plan, build]
    if: always() && needs.plan.outputs.skip != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      DEV_BASE: ${{ needs.plan.outputs.dev_base }}
      OPENTUI_REV: ${{ needs.plan.outputs.opentui_rev }}
      HEADER: ${{ needs.plan.outputs.header_fnv1a64 }}
      REF: ${{ inputs.ref || 'oc-rust' }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          set -euo pipefail
          cd dist
          jq -n \
            --arg version "$VERSION" --arg ref "$REF" --arg commit "$COMMIT" --arg dev_base "$DEV_BASE" \
            --arg rev "$OPENTUI_REV" --arg header "$HEADER" --arg rust "$RUST_VERSION" --arg zig "$ZIG_VERSION" \
            --arg ts_min "$OPENCODE_TS_MIN" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson assets "$(ls | jq -R . | jq -s .)" \
            '{version: $version, binary: "opencode-native",
              opencode: {repository: "anomalyco/opencode", ref: $ref, commit: $commit, dev_base: $dev_base},
              opentui: {repository: "anomalyco/opentui", rev: $rev, header_fnv1a64: $header},
              toolchain: {rust: $rust, zig: $zig, profile: "dist"},
              requires: {opencode: (">= " + $ts_min)},
              run: $run, assets: $assets}' > manifest.json
          sha256sum -- * > SHA256SUMS
          cat manifest.json SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Prerelease
        run: |
          set -euo pipefail
          short=${COMMIT:0:10}
          cat > notes.md <<EOF
          Preview build of \`opencode-native\`, the OpenCode native CLI, from [\`anomalyco/opencode@$short\`](https://github.com/anomalyco/opencode/commit/$COMMIT) (\`$REF\`; \`dev\` base [\`${DEV_BASE:0:10}\`](https://github.com/anomalyco/opencode/commit/$DEV_BASE)), OpenTUI [\`${OPENTUI_REV:0:10}\`](https://github.com/anomalyco/opentui/commit/$OPENTUI_REV).

          Unsigned preview. Needs the TypeScript \`opencode\` $OPENCODE_TS_MIN or newer on \`PATH\`. Install or update:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash
          \`\`\`

          Verify: \`sha256sum -c SHA256SUMS --ignore-missing\` and \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`.
          EOF
          # GITHUB_TOKEN cannot create a tag at a commit whose workflow files differ from the default branch (that needs
          # the workflows permission; the API answers 403 "Resource not accessible by integration"). When main moved
          # on during the run, tag main's head and name the workflow commit in the notes.
          target=$GITHUB_SHA
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            target=$head
            printf '\nBuilt by the workflow at %s; tagged at %s, the head of %s when it finished.\n' \
              "$GITHUB_SHA" "$head" "$GITHUB_REF_NAME" >> notes.md
          fi
          gh release create "v$VERSION" dist/* -R "$GITHUB_REPOSITORY" --target "$target" \
            --prerelease --title "opencode-native $VERSION" --notes-file notes.md
