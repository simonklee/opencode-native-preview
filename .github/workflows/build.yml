name: build

# Builds opencode-native, the OpenCode native CLI (packages/cli-rs of anomalyco/opencode), at `ref` for each preview
# platform, with the TypeScript opencode server built from the same commit bundled beside it (ts-cli), and
# publishes one prerelease per build. The nightly run skips when `native-next` has not moved since the
# last release. Only a run of `main` publishes: a run dispatched on another branch builds, tests and smokes the same
# way and keeps its archives as artifacts.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of anomalyco/opencode
        default: native-next
        required: true

# One group per branch: a newer run cancels an older one of the same branch, never main's.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.4.1"
  # The third-party notice's generator (notices/about.toml), pinned with the sha256 of its release tarball.
  CARGO_ABOUT_VERSION: "0.9.3"
  CARGO_ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      dev_base: ${{ steps.plan.outputs.dev_base }}
      opentui_rev: ${{ steps.plan.outputs.opentui_rev }}
      header_fnv1a64: ${{ steps.plan.outputs.header_fnv1a64 }}
      opentui_tag: ${{ steps.plan.outputs.opentui_tag }}
      opentui_release: ${{ steps.plan.outputs.opentui_release }}
      opentui_native: ${{ steps.plan.outputs.opentui_native }}
      zig_version: ${{ steps.plan.outputs.zig_version }}
      skip: ${{ steps.plan.outputs.skip }}
      bin: ${{ steps.plan.outputs.bin }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: preview
      - id: plan
        env:
          REF: ${{ inputs.ref || 'native-next' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q src && cd src
          git remote add origin https://github.com/anomalyco/opencode
          git fetch -q --filter=tree:0 origin "$REF"
          commit=$(git rev-parse FETCH_HEAD)
          git fetch -q --filter=tree:0 origin dev:refs/remotes/origin/dev
          dev_base=$(git merge-base "$commit" origin/dev)
          # OpenTUI pinned by release from crates.io (`version = "=X.Y.Z"`, tag vX.Y.Z, whose
          # commit the tag names), by release from git (`tag = "vX.Y.Z"`, whose commit Cargo.lock records), or by commit
          # (`rev`).
          dep=$(git show "$commit:packages/cli-rs/Cargo.toml" | grep -E '^opentui *= *\{') || { echo "no opentui dependency"; exit 1; }
          tag=$(sed -nE 's/.*[{,] *tag *= *"([^"]+)".*/\1/p' <<<"$dep")
          version=$(grep -vE '[{,] *(git|path) *=' <<<"$dep" | sed -nE 's/.*[{,] *version *= *"=([^"]+)".*/\1/p' || true)
          if [ -n "$version" ]; then
            tag=v$version
            # The commit of an annotated tag is its peeled ref (`^{}`); a lightweight tag has only its own.
            refs=$(git ls-remote https://github.com/anomalyco/opentui "refs/tags/$tag" "refs/tags/$tag^{}")
            rev=$(awk -v peeled="refs/tags/$tag^{}" '$2 == peeled { print $1 }' <<<"$refs")
            rev=${rev:-$(awk '{ print $1 }' <<<"$refs")}
          elif [ -n "$tag" ]; then
            rev=$(git show "$commit:packages/cli-rs/Cargo.lock" |
              sed -nE "s|^source = \"git\+https://github\.com/anomalyco/opentui(\.git)?\?tag=$tag#([0-9a-f]{40})\"$|\2|p" | sort -u)
          else
            rev=$(sed -nE 's/.*[{,] *rev *= *"([0-9a-f]{40})".*/\1/p' <<<"$dep")
          fi
          [ -n "$rev" ] && [ "$(wc -l <<<"$rev")" = 1 ] || { echo "no single OpenTUI commit for '$dep'"; exit 1; }
          hash=$(curl -fsSL "https://raw.githubusercontent.com/anomalyco/opentui/$rev/packages/rust/crates/opentui-sys/src/generated.rs" \
            | sed -nE 's/.*OPENTUI_HEADER_FNV1A64: u64 = (0x[0-9a-f_]+);.*/\1/p' | tr -d _)
          test -n "$hash"
          # Where each target's native library comes from: for a tag, the client's own script (its sha256 table); for a
          # rev, the OpenTUI release whose native zips hold what the pin builds (its header, and the same
          # packages/native), else a source build per target, as for a pin past the last release.
          release=
          if [ -n "$tag" ]; then
            native=tag
          else
            release=$("$GITHUB_WORKSPACE/preview/scripts/opentui-release.sh" tag "$hash" "$rev")
            native=${release:+release}
            native=${native:-source}
          fi
          # A client that pins its toolchain (rust-toolchain.toml) gets it in every cargo run, past `rustup default`, and
          # without the cross targets installed below: it must be the one this workflow installs and records.
          if toolchain=$(git show "$commit:packages/cli-rs/rust-toolchain.toml" 2>/dev/null); then
            channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' <<<"$toolchain")
            [ "$channel" = "$RUST_VERSION" ] || { echo "the client pins Rust '$channel', this workflow $RUST_VERSION"; exit 1; }
          fi
          # The Zig that the pinned OpenTUI's native build asks for.
          zig=$(curl -fsSL "https://raw.githubusercontent.com/anomalyco/opentui/$rev/packages/native/build.zig.zon" \
            | sed -nE 's/.*\.minimum_zig_version = "([^"]+)".*/\1/p')
          test -n "$zig"
          # The Cargo name of the client binary: opencode-rs before the rename (O-114), opencode-native after.
          # Every archive ships it as opencode-native. Drop this once a release has been built from the new name.
          bin=$(git show "$commit:packages/cli-rs/crates/cli/Cargo.toml" | awk '
            /^\[\[bin\]\]/ { inbin = 1; name = ""; next }
            /^\[/ { inbin = 0 }
            inbin && /^name *=/ { name = $0; sub(/^name *= *"/, "", name); sub(/".*/, "", name) }
            inbin && /^path *= *"src\/main\.rs"/ { print name; exit }')
          # The version prefix follows the name: a pre-rename client recognizes only 0.0.0-rs-<run> as a preview, and
          # its `upgrade` then points at the install script instead of updating the TypeScript CLI.
          case $bin in
            opencode-rs) version=0.0.0-rs-$GITHUB_RUN_NUMBER ;;
            opencode-native) version=0.0.0-native-$GITHUB_RUN_NUMBER ;;
            *) echo "unexpected client binary name '$bin'"; exit 1 ;;
          esac
          skip=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [ -n "$last" ]; then
              built=$(gh release download "$last" -R "$GITHUB_REPOSITORY" -p manifest.json -O - | jq -r .opencode.commit)
              [ "$built" = "$commit" ] && skip=true
            fi
          fi
          {
            echo "commit=$commit"
            echo "dev_base=$dev_base"
            echo "opentui_tag=$tag"
            echo "opentui_rev=$rev"
            echo "header_fnv1a64=$hash"
            echo "opentui_release=$release"
            echo "opentui_native=$native"
            echo "zig_version=$zig"
            echo "skip=$skip"
            echo "bin=$bin"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"
          echo "$REF -> $commit (dev base $dev_base), OpenTUI ${tag:+$tag at }$rev ($hash, Zig $zig, native: $native${release:+ $release}), binary $bin, version $version, skip=$skip" >> "$GITHUB_STEP_SUMMARY"

  # THIRD-PARTY-NOTICES.txt for every archive: the licences of the crates linked into the binary (the tree-sitter
  # grammars among them), read from Cargo.lock by cargo-about, with notices/about.toml's allow-list; then the highlight
  # queries compiled in, with their sources' licences (notices/queries.py).
  notices:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          sparse-checkout: packages/cli-rs
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: cargo-about
        run: |
          set -euo pipefail
          name=cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Generate
        working-directory: opencode/packages/cli-rs
        run: |
          set -euo pipefail
          # Every target's crates, so --frozen finds each licence file on disk and reads nothing from the network.
          cargo fetch --locked
          mkdir -p "$GITHUB_WORKSPACE/notices-out"
          cargo-about generate --frozen -c "$GITHUB_WORKSPACE/notices/about.toml" -m crates/cli/Cargo.toml \
            -o "$GITHUB_WORKSPACE/notices-out/THIRD-PARTY-NOTICES.txt" "$GITHUB_WORKSPACE/notices/about.hbs"
          # The highlight queries compiled in, with their sources' licences (notices/queries.tsv).
          python3 -I "$GITHUB_WORKSPACE/notices/queries.py" . "$GITHUB_WORKSPACE/notices-out/THIRD-PARTY-NOTICES.txt" |
            tee -a "$GITHUB_STEP_SUMMARY"
          sed -n '/^Licences:/,/^$/p' "$GITHUB_WORKSPACE/notices-out/THIRD-PARTY-NOTICES.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: notices-out/
          if-no-files-found: error

  # The TypeScript CLI each archive bundles beside opencode-native (bundle-server): packages/cli's own build from the
  # same commit at the same version, one target per leg, cross-compiled by Bun on Linux as OpenCode's build-cli does.
  # x64 takes the baseline build, as Desktop does. Channel `latest`, the client's when OPENCODE_CHANNEL is unset, so both
  # use service.json.
  ts-cli:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            ts: linux-x64-baseline
          - target: aarch64-unknown-linux-gnu
            ts: linux-arm64
          - target: x86_64-unknown-linux-musl
            ts: linux-x64-baseline-musl
          - target: aarch64-unknown-linux-musl
            ts: linux-arm64-musl
          - target: aarch64-apple-darwin
            ts: darwin-arm64
          - target: x86_64-apple-darwin
            ts: darwin-x64-baseline
          - target: x86_64-pc-windows-msvc
            ts: windows-x64-baseline
          - target: aarch64-pc-windows-msvc
            ts: windows-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
      # The Bun the repository pins (package.json packageManager), which its build checks.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: opencode/package.json
      - name: Install
        working-directory: opencode
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: opencode/packages/cli
        env:
          OPENCODE_TARGET: ${{ matrix.ts }}
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: latest
          # Read-only; raises the rate limit for the Bun release download.
          GH_TOKEN: ${{ github.token }}
          TS: ${{ matrix.ts }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          bun=$(jq -r .packageManager ../../package.json)
          start=$(date +%s)
          # The Bun release the executable embeds, the one the repository pins, as release.yml's build-cli sets it.
          BUN_COMPILE_RELEASE=bun-v${bun#bun@} bun run script/build.ts
          echo "build ($TS): $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exe=opencode
          case $TS in windows-*) exe=opencode.exe ;; esac
          mkdir -p "$GITHUB_WORKSPACE/ts-cli"
          cp "dist/cli-$TS/bin/$exe" "$GITHUB_WORKSPACE/ts-cli/$exe"
          echo "$exe: $(wc -c < "$GITHUB_WORKSPACE/ts-cli/$exe") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$TS" = linux-x64-baseline ]; then
            out=$("$GITHUB_WORKSPACE/ts-cli/$exe" --version)
            echo "$out"
            case $out in *"$VERSION"*) ;; *) echo "--version printed '$out', not $VERSION"; exit 1 ;; esac
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ts-cli-${{ matrix.target }}
          path: ts-cli/
          if-no-files-found: error

  # RustSec advisories against the crates the client links, read from packages/cli-rs/deny.toml and the database. A new
  # one fails this job and so blocks the release; a commit from before the policy has none to check and still publishes.
  advisories:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          sparse-checkout: packages/cli-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Advisories
        working-directory: opencode/packages/cli-rs
        run: |
          set -euo pipefail
          # cargo deny arrived with deny.toml; an older ref is not failed for lacking the policy it predates.
          if [ ! -f deny.toml ]; then
            echo "::notice::${{ needs.plan.outputs.commit }} predates cargo deny; advisories not checked"
            exit 0
          fi
          cargo deny --workspace --locked check --hide-inclusion-graph advisories

  build:
    needs: [plan, notices, ts-cli]
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux matches OpenTUI's floors (O-164): glibc 2.17 through cargo zigbuild. musl links fully static (O-188).
          # musl is optional until it has passed: a client from before musl-static links musl dynamically, which the
          # floor check refuses.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            lto: fat
            libc: gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            lto: fat
            libc: gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            lto: fat
            libc: musl
            optional: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            lto: fat
            libc: musl
            optional: true
          - target: aarch64-apple-darwin
            os: macos-15
            lto: fat
          # Cross-compiled on the arm64 runner and run under Rosetta 2. Optional until it has passed: a failure leaves
          # its archive out of the release and fails nothing else.
          - target: x86_64-apple-darwin
            os: macos-15
            lto: fat
            run: arch -x86_64
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.optional == true }}
    env:
      TARGET: ${{ matrix.target }}
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
      # How the runner starts the target's binary: through Rosetta for x86_64 macOS.
      RUN: ${{ matrix.run }}
      # Linux only: the C library, and the target cargo zigbuild links for (glibc's carries the 2.17 floor).
      LIBC: ${{ matrix.libc }}
      ZIG_TARGET: ${{ matrix.target }}${{ matrix.libc == 'gnu' && '.2.17' || '' }}
      OPENTUI_NATIVE: ${{ needs.plan.outputs.opentui_native }}
      OPENTUI_RELEASE: ${{ needs.plan.outputs.opentui_release }}
      HEADER: ${{ needs.plan.outputs.header_fnv1a64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          # Everything the build reads: the package, and the attention sounds tui includes from packages/ui.
          sparse-checkout: |
            packages/cli-rs
            packages/ui/src/assets/audio

      # A tag pin's release zip; for a rev pin, the OpenTUI release zip that holds what it builds, else a source build,
      # cached by pin and target.
      - id: native-cache
        if: env.OPENTUI_NATIVE == 'source'
        uses: actions/cache@v4
        with:
          path: native
          key: opentui-native-${{ needs.plan.outputs.opentui_rev }}-${{ matrix.target }}-v2
      # Zig, OpenTUI's version: for a source build of the library, and on Linux as cargo zigbuild's linker.
      - if: (env.OPENTUI_NATIVE == 'source' && steps.native-cache.outputs.cache-hit != 'true') || env.LIBC != ''
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.plan.outputs.zig_version }}
      - if: env.OPENTUI_NATIVE == 'tag' || (env.OPENTUI_NATIVE == 'source' && steps.native-cache.outputs.cache-hit != 'true')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # A tag pin: the client's script installs the release zip it checks against its own sha256 table (opentui.h, the
      # static archive opentui-sys links, licenses/), as a local build of the client does.
      - name: OpenTUI native library (client's release zip)
        if: env.OPENTUI_NATIVE == 'tag'
        run: |
          bun run --cwd opencode/packages/cli-rs opentui:native --target "$TARGET" --dest "$GITHUB_WORKSPACE/native"
          cat native/STAMP.json
      - name: OpenTUI native library (release zip)
        if: env.OPENTUI_NATIVE == 'release'
        run: scripts/opentui-release.sh fetch "$OPENTUI_RELEASE" "$TARGET" native "$HEADER" && cat native/STAMP
      - name: OpenTUI native library (source build)
        if: env.OPENTUI_NATIVE == 'source'
        run: scripts/opentui-native.sh "$TARGET" native && cat native/STAMP

      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - if: env.LIBC != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencode/packages/cli-rs -> target
          key: ${{ matrix.target }}-dist
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
      - name: Rosetta 2
        if: matrix.run == 'arch -x86_64'
        run: |
          # The arm64 image may come without it; the install is a no-op where it is present.
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Build
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}/native
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          # The client reads OPENCODE_NATIVE_COMMIT since the rename and OPENCODE_RS_COMMIT before it.
          OPENCODE_NATIVE_COMMIT: ${{ needs.plan.outputs.commit }}
          OPENCODE_RS_COMMIT: ${{ needs.plan.outputs.commit }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CARGO_PROFILE_DIST_LTO: ${{ matrix.lto }}
          # rustc runs dsymutil, so the debug information outlives the deleted object files.
          CARGO_PROFILE_DIST_SPLIT_DEBUGINFO: ${{ runner.os == 'macOS' && 'packed' || 'off' }}
        run: |
          start=$(date +%s)
          if [ -n "$LIBC" ]; then
            # Zig links against glibc 2.17's symbols, or musl statically (Rust's default crt-static); its output lands in
            # target/$TARGET as cargo's does.
            cargo zigbuild --locked --profile dist --target "$ZIG_TARGET" --bin "$BIN"
          else
            cargo build --locked --profile dist --target "$TARGET" --bin "$BIN"
          fi
          echo "build: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Strip
        run: |
          set -euo pipefail
          mkdir -p stage debug
          bin=opencode/packages/cli-rs/target/$TARGET/dist/$BIN
          cp "$bin" stage/opencode-native
          if [ "$RUNNER_OS" = macOS ]; then
            # Cargo's $BIN.dSYM is a symlink into deps/; copy the bundle it points at.
            cp -RL "$bin.dSYM" debug/opencode-native.dSYM
            strip stage/opencode-native
            # strip invalidates the linker's ad-hoc signature; arm64 macOS runs only signed code.
            codesign --force --sign - stage/opencode-native
          else
            objcopy --only-keep-debug stage/opencode-native debug/opencode-native.debug
            strip --strip-all stage/opencode-native
            objcopy --add-gnu-debuglink=debug/opencode-native.debug stage/opencode-native
          fi
          ls -l "$bin" stage/opencode-native | tee -a "$GITHUB_STEP_SUMMARY"
      # The TypeScript server built from the same commit (ts-cli), beside the client in every archive (bundle-server).
      - uses: actions/download-artifact@v5
        with:
          name: ts-cli-${{ matrix.target }}
          path: stage
      - name: Bundled server
        run: |
          set -euo pipefail
          # Artifacts drop the mode bits.
          chmod 755 stage/opencode
          if [ "$RUNNER_OS" = macOS ]; then
            # Ad hoc, as opencode-native is and as Desktop signs its copy: no hardened runtime, so Bun's JIT needs no
            # entitlement, and arm64 macOS runs only signed code.
            codesign --force --sign - stage/opencode
            codesign --verify --verbose=2 stage/opencode
          fi
          echo "bundled opencode: $(wc -c < stage/opencode) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Linux floor
        if: env.LIBC != ''
        run: |
          set -euo pipefail
          scripts/check-linux.sh stage/opencode-native "$LIBC" | tee -a "$GITHUB_STEP_SUMMARY"
          # Bun's glibc build keeps the same floor; its musl build needs libstdc++ and libgcc (the Alpine smoke adds
          # them, as OpenCode's Docker image does), so only the gnu one is held to it.
          if [ "$LIBC" = gnu ]; then scripts/check-linux.sh stage/opencode gnu | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Smoke test
        # A fresh box: no other opencode on PATH, the bundled server for the service, a mock provider for a session,
        # and a TypeScript TUI plugin on the bundled Bun (scripts/smoke-bundle.sh). The bundled server's musl Bun needs
        # musl's loader and libstdc++, so the musl bundle's smoke runs in Alpine below.
        run: |
          set -euo pipefail
          file stage/opencode-native stage/opencode
          out=$($RUN stage/opencode-native --version)
          echo "$out"
          case $out in *"$VERSION"*) ;; *) echo "--version printed '$out', not $VERSION"; exit 1 ;; esac
          if [ "$LIBC" != musl ]; then scripts/smoke-bundle.sh stage | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Floor smoke files
        # The bundle for the floor's smoke.
        if: env.LIBC != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke/bundle"
          cp "$GITHUB_WORKSPACE/stage/opencode-native" "$GITHUB_WORKSPACE/stage/opencode" "$RUNNER_TEMP/smoke/bundle/"
          cp -r "$GITHUB_WORKSPACE/scripts" "$GITHUB_WORKSPACE/bench" "$RUNNER_TEMP/smoke/"
      - name: Smoke test on the floor (CentOS 7, glibc 2.17)
        # The client and its bundled server on glibc 2.17: the service starts from the bundled binary.
        if: env.LIBC == 'gnu'
        run: |
          set -euo pipefail
          out=$(docker run --rm -e HOME=/tmp -e TMPDIR=/tmp -v "$RUNNER_TEMP/smoke:/work:ro" centos:7 sh -euc '
            ldd --version | head -n 1
            /work/bundle/opencode-native --version
            /work/bundle/opencode --version
            mkdir -p /tmp/project && cd /tmp/project
            timeout 180 /work/bundle/opencode-native session list --format json > /tmp/sessions.json
            /work/bundle/opencode-native service stop
            cat /tmp/sessions.json')
          echo "$out"
          case $out in *"$VERSION"*"opencode v$VERSION"*) ;; *) echo "no version or bundled server"; exit 1 ;; esac
          [ "$(tail -n 1 <<<"$out" | head -c 1)" = "[" ] || { echo "session list printed no JSON array"; exit 1; }
      - name: Smoke test on the floor (Alpine, musl)
        # The bundled server's musl Bun needs musl's loader, libstdc++ and libgcc, which OpenCode's Docker image adds
        # too; the static client needs nothing. Then the bundle's smoke test, as on the other legs.
        if: env.LIBC == 'musl'
        run: |
          set -euo pipefail
          out=$(docker run --rm -e HOME=/tmp -e TMPDIR=/tmp -v "$RUNNER_TEMP/smoke:/work:ro" alpine:3.22 sh -euc '
            cat /etc/alpine-release
            /work/bundle/opencode-native --version
            apk add --no-cache libgcc libstdc++ bash python3 >/dev/null
            bash /work/scripts/smoke-bundle.sh /work/bundle')
          echo "$out"
          case $out in *"$VERSION"*"smoke: ok"*) ;; *) echo "no version or bundle smoke"; exit 1 ;; esac

      - uses: actions/download-artifact@v5
        with:
          name: notices
          path: stage
      - name: Package
        run: |
          set -euo pipefail
          # OpenCode's licence, the crates' notice, and OpenTUI's licence files (its own, FFmpeg's and the rest its
          # library carries) from the zip or the source tree.
          cp opencode/LICENSE stage/
          mkdir -p stage/licenses/opentui
          cp native/licenses/* stage/licenses/opentui/
          test -s stage/THIRD-PARTY-NOTICES.txt
          name=opencode-native-$VERSION-$TARGET
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C stage opencode-native opencode LICENSE THIRD-PARTY-NOTICES.txt licenses
          tar -tzf "dist/$name.tar.gz"
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Debian package
        # glibc builds only; their floor is OpenTUI's 2.17, and Zig's link needs no libgcc_s.
        if: env.LIBC == 'gnu'
        run: |
          set -euo pipefail
          case $TARGET in x86_64-*) arch=amd64 ;; aarch64-*) arch=arm64 ;; esac
          # Without a revision, so the release version with each - turned into ~ (0.0.0~native~12) is valid.
          debversion=${VERSION//-/\~}
          root=$RUNNER_TEMP/deb
          doc=$root/usr/share/doc/opencode-native
          # Both binaries in a private directory, so the bundled opencode stays off PATH and never shadows the user's;
          # the client finds it beside its own real path.
          lib=$root/usr/lib/opencode-native
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$lib" "$doc/licenses/opentui"
          install -m 755 stage/opencode-native "$lib/opencode-native"
          install -m 755 stage/opencode "$lib/opencode"
          ln -s ../lib/opencode-native/opencode-native "$root/usr/bin/opencode-native"
          # Debian keeps a package's licences in its doc directory, OpenCode's as `copyright`.
          install -m 644 stage/LICENSE "$doc/copyright"
          install -m 644 stage/THIRD-PARTY-NOTICES.txt "$doc/THIRD-PARTY-NOTICES.txt"
          install -m 644 stage/licenses/opentui/* "$doc/licenses/opentui/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: opencode-native
          Version: $debversion
          Architecture: $arch
          Maintainer: Simon Klee <hello@simonklee.dk>
          Depends: libc6 (>= 2.17)
          Section: devel
          Priority: optional
          Homepage: https://github.com/$GITHUB_REPOSITORY
          Description: OpenCode native CLI (preview)
           A Rust client for OpenCode, with the TypeScript opencode server it runs, built from the same commit.
          EOF
          # The file name keeps the release version: GitHub turns ~ into . in asset names, which would no longer match
          # the SHA256SUMS line.
          dpkg-deb --root-owner-group --build "$root" "dist/opencode-native_${VERSION}_$arch.deb"
          dpkg-deb --info "dist/opencode-native_${VERSION}_$arch.deb"
          dpkg-deb --contents "dist/opencode-native_${VERSION}_$arch.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.target }}
          path: debug/
          retention-days: 90
          if-no-files-found: error

  # The Windows libraries, from the pin's OpenTUI release zip or cross-built here: FFmpeg does not build on Windows
  # hosts. A tag pin's zip has opentui-static.lib and no DLL, so the .exe links it and its zip holds the .exe alone.
  native-windows:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: ubuntu-22.04
    env:
      TARGET: ${{ matrix.target }}
      OPENTUI_NATIVE: ${{ needs.plan.outputs.opentui_native }}
      OPENTUI_RELEASE: ${{ needs.plan.outputs.opentui_release }}
      HEADER: ${{ needs.plan.outputs.header_fnv1a64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          sparse-checkout: packages/cli-rs
      - id: native-cache
        if: env.OPENTUI_NATIVE == 'source'
        uses: actions/cache@v4
        with:
          path: native
          key: opentui-native-${{ needs.plan.outputs.opentui_rev }}-${{ matrix.target }}-v2
      - if: env.OPENTUI_NATIVE == 'source' && steps.native-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ needs.plan.outputs.zig_version }}
      - if: env.OPENTUI_NATIVE == 'tag' || (env.OPENTUI_NATIVE == 'source' && steps.native-cache.outputs.cache-hit != 'true')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # A tag pin: the client's script installs the release zip it checks against its own sha256 table (opentui.h, the
      # static archive opentui-sys links, licenses/), as a local build of the client does.
      - name: OpenTUI native library (client's release zip)
        if: env.OPENTUI_NATIVE == 'tag'
        run: |
          bun run --cwd opencode/packages/cli-rs opentui:native --target "$TARGET" --dest "$GITHUB_WORKSPACE/native"
          cat native/STAMP.json
      - name: OpenTUI native library (release zip)
        if: env.OPENTUI_NATIVE == 'release'
        run: scripts/opentui-release.sh fetch "$OPENTUI_RELEASE" "$TARGET" native "$HEADER" && cat native/STAMP
      - name: OpenTUI native library (source build)
        if: env.OPENTUI_NATIVE == 'source'
        run: scripts/opentui-native.sh "$TARGET" native && cat native/STAMP
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/
          if-no-files-found: error

  # The Windows builds and their smoke tests (W10). Their zips go into the release with the other archives (W12).
  windows:
    needs: [plan, notices, native-windows, ts-cli]
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          # Optional until it has passed: a failure leaves its zip out of the release and fails nothing else.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.optional == true }}
    env:
      TARGET: ${{ matrix.target }}
      BIN: ${{ needs.plan.outputs.bin }}
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # The preview repository, for the mock provider of Smoke 4.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: preview
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          sparse-checkout: |
            packages/cli-rs
            packages/ui/src/assets/audio
      - uses: actions/download-artifact@v5
        with:
          name: native-${{ matrix.target }}
          path: native
      # The TypeScript server built from the same commit (ts-cli), beside the client in the zip (bundle-server).
      - uses: actions/download-artifact@v5
        with:
          name: ts-cli-${{ matrix.target }}
          path: stage
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Clang (ring)
        # ring builds its C and assembly for aarch64-pc-windows-msvc with clang only (D85); cl.exe serves the rest.
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $dirs = @("$env:ProgramFiles\LLVM\bin") + @(& $vswhere -latest -products * -find 'VC\Tools\Llvm\ARM64\bin')
            $dir = $dirs | Where-Object { $_ -and (Test-Path (Join-Path $_ 'clang.exe')) } | Select-Object -First 1
            if (-not $dir) { throw 'no clang.exe: neither on PATH, in LLVM nor in Visual Studio' }
            $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $clang = Join-Path $dir 'clang.exe'
          }
          & $clang --version | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencode/packages/cli-rs -> target
          key: ${{ env.TARGET }}-dist
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}\native
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_NATIVE_COMMIT: ${{ needs.plan.outputs.commit }}
          OPENCODE_RS_COMMIT: ${{ needs.plan.outputs.commit }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --profile dist --target "$TARGET" --bin "$BIN"
      - name: Imports - does the .exe need opentui.dll?
        # v0.9.0's opentui-sys links opentui.dll on Windows (D85); one that links opentui-static.lib on MSVC (OpenTUI
        # #2140) makes the .exe one file. The zip ships opentui.dll only when the built .exe imports it.
        id: imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # The runner's own host tools (Hostx64 on windows-2025, HostARM64 on windows-11-arm); either target's dumpbin
          # reads either machine's executable.
          $tools = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'HostARM64' } else { 'Hostx64' }
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\*\bin\$tools\*\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          "DUMPBIN=$dumpbin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $exe = "opencode\packages\cli-rs\target\$env:TARGET\dist\$env:BIN.exe"
          $deps = & $dumpbin /nologo /dependents $exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } |
            ForEach-Object { $_.Trim().ToLowerInvariant() }
          if ($deps -contains 'opentui.dll') {
            if (-not (Test-Path native\opentui.dll)) { throw 'the .exe imports opentui.dll, which the archive lacks' }
            $layout = 'dll'
          } else {
            if (-not (Test-Path native\opentui-static.lib)) { throw 'the .exe imports no opentui.dll, but the archive has no opentui-static.lib' }
            $layout = 'static'
          }
          "layout=$layout" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "OpenTUI on Windows: $layout (dependents: $($deps -join ', '))" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/download-artifact@v5
        with:
          name: notices
          path: stage
      - name: Package and smoke test
        id: package
        env:
          LAYOUT: ${{ steps.imports.outputs.layout }}
        run: |
          set -euo pipefail
          mkdir -p stage/licenses/opentui dist debug
          cp "opencode/packages/cli-rs/target/$TARGET/dist/$BIN.exe" stage/opencode-native.exe
          cp opencode/LICENSE stage/
          test -s stage/opencode.exe
          files=(opencode-native.exe opencode.exe LICENSE THIRD-PARTY-NOTICES.txt licenses)
          if [ "$LAYOUT" = dll ]; then
            cp native/opentui.dll stage/
            files+=(opentui.dll)
          fi
          # The crates' notice, and every licence and source notice of OpenTUI's archive (its own, FFmpeg's and the
          # rest its library carries).
          cp native/licenses/* stage/licenses/opentui/
          test -s stage/THIRD-PARTY-NOTICES.txt
          cp "opencode/packages/cli-rs/target/$TARGET/dist/${BIN//-/_}.pdb" debug/opencode_native.pdb || true
          out=$(stage/opencode-native.exe --version)
          echo "$out"
          case $out in *"$VERSION"*) ;; *) echo "--version printed '$out', not $VERSION"; exit 1 ;; esac
          out=$(stage/opencode.exe --version)
          echo "bundled: $out"
          case $out in *"$VERSION"*) ;; *) echo "the bundled opencode.exe printed '$out', not $VERSION"; exit 1 ;; esac
          (cd stage && 7z a -tzip "../dist/opencode-native-$VERSION-$TARGET.zip" "${files[@]}" >/dev/null)
          7z l "dist/opencode-native-$VERSION-$TARGET.zip"
          ls -l stage dist
      - uses: actions/upload-artifact@v4
        with:
          name: debug-${{ env.TARGET }}
          path: debug/
          retention-days: 90

      - name: Smoke 1 - version (pwsh)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & stage\opencode-native.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          "$out"
          if ("$out" -notlike "*$env:VERSION*") { throw "--version printed '$out', not $env:VERSION" }

      - name: Smoke 2 - dependents are system DLLs, and opentui.dll as the layout says (+crt-static)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        env:
          LAYOUT: ${{ steps.imports.outputs.layout }}
        run: |
          $ErrorActionPreference = 'Stop'
          $text = & $env:DUMPBIN /nologo /dependents stage\opencode-native.exe
          $text
          $deps = $text | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLowerInvariant() }
          $dll = $deps -contains 'opentui.dll'
          if ($env:LAYOUT -eq 'dll' -and -not $dll) { throw 'opentui.dll is not a dependent' }
          if ($env:LAYOUT -eq 'static' -and $dll) { throw 'the static build imports opentui.dll' }
          $crt = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
          if ($crt) { throw "dynamic CRT imports (no +crt-static?): $($crt -join ', ')" }
          $system = "$env:SystemRoot\System32"
          $other = $deps | Where-Object {
            $_ -ne 'opentui.dll' -and $_ -notmatch '^(api|ext)-ms-win-' -and -not (Test-Path (Join-Path $system $_))
          }
          if ($other) { throw "non-system dependents: $($other -join ', ')" }
          "dependents: $($deps -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: Smoke 3 - the .exe alone, with no opentui.dll beside it or on PATH
        # The DLL layout must fail with 0xC0000135, which proves the zip needs the DLL; the static one must run.
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        env:
          LAYOUT: ${{ steps.imports.outputs.layout }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'no-dll'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item stage\opencode-native.exe $dir
          # PATH without native\ or stage\, so no other opentui.dll is found.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath (Join-Path $dir 'opencode-native.exe') -ArgumentList '--version' `
            -WorkingDirectory $dir -NoNewWindow -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'hung without opentui.dll' }
          $code = '{0:X8}' -f $p.ExitCode
          "exit 0x$code ($env:LAYOUT)"
          if ($env:LAYOUT -eq 'dll' -and $code -ne 'C0000135') { throw "expected 0xC0000135 (STATUS_DLL_NOT_FOUND), got 0x$code" }
          if ($env:LAYOUT -eq 'static' -and $code -ne '00000000') { throw "the one-file .exe exited 0x$code" }

      - name: Smoke 4 - bundled server, a session on a mock provider, service stop (W5)
        # A fresh box: no opencode on PATH. The client starts its service from the bundled opencode.exe, a session gets
        # the mock provider's reply (the mock runs on the bundled binary as Bun), and service stop ends it. The TUI
        # plugin step of scripts/smoke-bundle.sh needs a pty and is not run here.
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = Get-Command opencode -ErrorAction SilentlyContinue
          if ($found) { throw "an opencode is on PATH ($($found.Source)); the smoke needs a box without one" }
          $root = Join-Path $env:RUNNER_TEMP 'home'
          $env:USERPROFILE = $root
          $env:HOME = $root
          $env:XDG_CONFIG_HOME = "$root\.config"
          $env:XDG_DATA_HOME = "$root\.local\share"
          $env:XDG_STATE_HOME = "$root\.local\state"
          $env:XDG_CACHE_HOME = "$root\.cache"
          foreach ($d in $env:XDG_CONFIG_HOME, $env:XDG_DATA_HOME, $env:XDG_STATE_HOME, $env:XDG_CACHE_HOME) {
            New-Item -ItemType Directory -Force $d | Out-Null
          }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'stage\opencode-native.exe'
          $ts = Join-Path $env:GITHUB_WORKSPACE 'stage\opencode.exe'
          $project = Join-Path $env:RUNNER_TEMP 'project'
          New-Item -ItemType Directory -Force $project | Out-Null
          Set-Location $project
          function Invoke-Bounded([string[]] $arguments, [string] $name) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$name timed out" }
            # Out-Host, so the output is not part of the function's return value.
            Get-Content "$name.out", "$name.err" | Out-Host
            return $p.ExitCode
          }
          # The mock provider on the bundled binary as Bun: it prints its URL first.
          $env:BUN_BE_BUN = '1'
          "bundled Bun $(& $ts --version)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $mock = Start-Process -FilePath $ts -ArgumentList @((Join-Path $env:GITHUB_WORKSPACE 'preview\bench\mock-provider.ts'), '0', '8', '0') `
            -NoNewWindow -PassThru -RedirectStandardOutput mock.out -RedirectStandardError mock.err
          Remove-Item Env:BUN_BE_BUN
          $url = $null
          foreach ($i in 1..200) {
            $line = Get-Content mock.out -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($line) { $url = ($line | ConvertFrom-Json).url; break }
            Start-Sleep -Milliseconds 50
          }
          if (-not $url) { throw "the mock provider printed no URL: $(Get-Content -Raw mock.out, mock.err)" }
          $env:OPENCODE_CONFIG_CONTENT = @{
            model = 'mock/mock-model'; update = 'disable'; share = 'disabled'; snapshots = $false
            providers = @{ mock = @{ name = 'Mock'; package = '@ai-sdk/openai-compatible'
              settings = @{ baseURL = "$url/v1"; apiKey = 'mock' }
              models = @{ 'mock-model' = @{ name = 'Mock Model'; capabilities = @{ tools = $false }; limit = @{ context = 200000; output = 8192 } } } } }
          } | ConvertTo-Json -Depth 10 -Compress
          $env:OPENCODE_DISABLE_MODELS_FETCH = '1'
          $env:OPENCODE_DISABLE_AUTOUPDATE = '1'
          try {
            # JSON, so an empty list still proves the service answered.
            $code = Invoke-Bounded @('session', 'list', '--format', 'json') 'session-list'
            if ($code -ne 0) { throw "session list exited $code" }
            $list = Get-Content -Raw session-list.out | ConvertFrom-Json -NoEnumerate
            if ($list -isnot [array]) { throw 'session list did not print a JSON array' }
            # The registration is in the state directory; <config>\opencode\service.json holds the service's settings
            # (hostname, port, password) and stays.
            $registered = Get-ChildItem -Recurse -Filter 'service*.json' $env:XDG_STATE_HOME
            "registered: $($registered.FullName -join ', ')"
            if (-not $registered) { throw 'no service*.json after session list' }
            $service = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' }
            "service: $($service.ExecutablePath -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            if (-not ($service.ExecutablePath -contains $ts)) { throw "the service does not run the bundled $ts" }
            $code = Invoke-Bounded @('run', 'Say hello') 'run'
            if ($code -ne 0) { throw "run exited $code" }
            if (-not (Select-String -Quiet 'quick brown fox' run.out)) { throw 'run printed no mock reply' }
            'a session got the mock reply' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            $code = Invoke-Bounded @('service', 'stop') 'service-stop'
            if ($code -ne 0) { throw "service stop exited $code" }
            Start-Sleep -Seconds 2
            $left = Get-ChildItem -Recurse -Filter 'service*.json' $env:XDG_STATE_HOME
            if ($left) { throw "service*.json still there after service stop: $($left.FullName -join ', ')" }
            $alive = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' }
            if ($alive) { throw "service still running: $($alive.ProcessId -join ', ')" }
          } catch {
            Get-ChildItem -Recurse -Filter '*.log' $root | ForEach-Object { "== $($_.FullName)"; Get-Content -Tail 60 $_ }
            throw
          } finally {
            Stop-Process -Force -Id $mock.Id -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' } |
              ForEach-Object { Stop-Process -Force -Id $_.ProcessId -ErrorAction SilentlyContinue }
          }

      - name: Smoke 4b - npm's opencode.cmd on PATH, without the bundled server (W5)
        # The published TypeScript CLI from `npm i -g` into a temporary prefix on PATH, and opencode-native.exe alone in
        # a directory with no opencode.exe beside it: the client must find npm's opencode.cmd through PATH and PATHEXT
        # and run the .exe it names. session list starts the service through it, and service stop ends it. The step
        # before it (Smoke 4) covers the bundled server; this one the lookup a user without the bundle relies on.
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'npm-prefix'
          New-Item -ItemType Directory -Force $prefix | Out-Null
          npm install -g --prefix $prefix "@opencode/cli@latest" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "npm install exited $LASTEXITCODE" }
          $env:PATH = "$prefix;$env:PATH"
          $shim = Join-Path $prefix 'opencode.cmd'
          if (-not (Test-Path $shim)) { throw "npm wrote no $shim" }
          $npmExe = Join-Path $prefix 'node_modules\@opencode\cli\bin\opencode.exe'
          "TypeScript CLI: $(opencode --version)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "where opencode: $((where.exe opencode) -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          # The client alone: no bundled opencode.exe beside it, so only PATH can serve.
          $alone = Join-Path $env:RUNNER_TEMP 'client-alone'
          New-Item -ItemType Directory -Force $alone | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'stage\opencode-native.exe') $alone
          if (Test-Path (Join-Path $alone 'opencode.exe')) { throw 'opencode.exe is beside the client' }
          $exe = Join-Path $alone 'opencode-native.exe'
          $root = Join-Path $env:RUNNER_TEMP 'home-npm'
          $env:USERPROFILE = $root
          $env:HOME = $root
          $env:XDG_CONFIG_HOME = "$root\.config"
          $env:XDG_DATA_HOME = "$root\.local\share"
          $env:XDG_STATE_HOME = "$root\.local\state"
          $env:XDG_CACHE_HOME = "$root\.cache"
          foreach ($d in $env:XDG_CONFIG_HOME, $env:XDG_DATA_HOME, $env:XDG_STATE_HOME, $env:XDG_CACHE_HOME) {
            New-Item -ItemType Directory -Force $d | Out-Null
          }
          Remove-Item Env:OPENCODE_TS_BIN -ErrorAction SilentlyContinue
          $project = Join-Path $env:RUNNER_TEMP 'project-npm'
          New-Item -ItemType Directory -Force $project | Out-Null
          Set-Location $project
          function Invoke-Bounded([string[]] $arguments, [string] $name) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$name timed out" }
            # Out-Host, so the output is not part of the function's return value.
            Get-Content "$name.out", "$name.err" | Out-Host
            return $p.ExitCode
          }
          try {
            # JSON, so an empty list still proves the service answered.
            $code = Invoke-Bounded @('session', 'list', '--format', 'json') 'session-list'
            if ($code -ne 0) { throw "session list exited $($code); the client did not find npm's opencode.cmd on PATH" }
            $list = Get-Content -Raw session-list.out | ConvertFrom-Json -NoEnumerate
            if ($list -isnot [array]) { throw 'session list did not print a JSON array' }
            $registered = Get-ChildItem -Recurse -Filter 'service*.json' $env:XDG_STATE_HOME
            "registered: $($registered.FullName -join ', ')"
            if (-not $registered) { throw 'no service*.json after session list' }
            # The shim resolves to the .exe it runs, so the service is npm's opencode.exe, not cmd.exe.
            $service = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' }
            "service: $($service.ExecutablePath -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            if (-not ($service.ExecutablePath -contains $npmExe)) { throw "the service does not run npm's $npmExe" }
            $code = Invoke-Bounded @('service', 'stop') 'service-stop'
            if ($code -ne 0) { throw "service stop exited $code" }
            Start-Sleep -Seconds 2
            $left = Get-ChildItem -Recurse -Filter 'service*.json' $env:XDG_STATE_HOME
            if ($left) { throw "service*.json still there after service stop: $($left.FullName -join ', ')" }
            $alive = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' }
            if ($alive) { throw "service still running: $($alive.ProcessId -join ', ')" }
            "finds npm's opencode.cmd on PATH: True" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } catch {
            Get-ChildItem -Recurse -Filter '*.log' $root | ForEach-Object { "== $($_.FullName)"; Get-Content -Tail 60 $_ }
            throw
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'serve --service' } |
              ForEach-Object { Stop-Process -Force -Id $_.ProcessId -ErrorAction SilentlyContinue }
          }

      - name: Smoke 5 - TUI and prompts on a pseudoconsole (W10)
        # Each smoke runs once the package exists, also after an earlier smoke failed.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}\native
          RUSTFLAGS: -C target-feature=+crt-static
          OPENCODE_SMOKE_OUT: ${{ runner.temp }}\smoke
        run: |
          $ErrorActionPreference = 'Stop'
          # The test lands with W10; commits before it have nothing to run.
          if (-not (Test-Path crates\cli\tests\windows_smoke.rs)) {
            'windows_smoke.rs is not in this commit; skipped' | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $env:PATH = "$env:OPENTUI_LIB_DIR;$env:PATH"
          cargo test --locked --target $env:TARGET -p opencode-cli --test windows_smoke -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "windows_smoke failed ($LASTEXITCODE)" }

      # After every smoke passed, so a zip that failed one never reaches the release (an optional target's job does not
      # fail it).
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.TARGET }}
          path: dist/
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}\smoke
          if-no-files-found: ignore

  # The workspace's tests on Windows. A release needs them to pass (W12).
  windows-test:
    needs: [plan, native-windows]
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      # Byte-for-byte fixtures (TypeScript help, completions, P-COMP) must keep LF; the runner's Git defaults to CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          repository: anomalyco/opencode
          ref: ${{ needs.plan.outputs.commit }}
          path: opencode
          persist-credentials: false
          # The whole tree: tests read fixtures outside packages/cli-rs (themes in packages/tui, the TS sources
          # some parity checks compare against).
      - uses: actions/download-artifact@v5
        with:
          name: native-x86_64-pc-windows-msvc
          path: native
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencode/packages/cli-rs -> target
          key: ${{ env.TARGET }}-test
          save-if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
      - name: cargo test
        working-directory: opencode/packages/cli-rs
        env:
          OPENTUI_LIB_DIR: ${{ github.workspace }}\native
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_NATIVE_COMMIT: ${{ needs.plan.outputs.commit }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/test"
          log=$RUNNER_TEMP/test/cargo-test.txt
          # opentui.dll must be on PATH for the test binaries.
          export PATH="$GITHUB_WORKSPACE/native:$PATH"
          run=(cargo test --locked --workspace --target "$TARGET")
          if "${run[@]}" --no-fail-fast 2>&1 | tee "$log"; then exit 0; fi

          # The merge lane's flake rule: a test that failed is run alone three times, and the job passes only when each
          # failed test passes every rerun. More than three failed tests, or a target that failed without a named test
          # (a compile error, a crashed binary, a doctest), fails it as before.
          # Cargo colors its own `error:` lines (CARGO_TERM_COLOR); strip the escapes so they match below.
          tr -d '\r' < "$log" | sed -E 's/\x1b\[[0-9;]*m//g' > "$log.lf"
          mapfile -t failed < <(sed -nE 's/^test ([A-Za-z0-9_:]+) \.\.\. FAILED$/\1/p' "$log.lf" | sort -u)
          # Each target's results follow its `Running`/`Doc-tests` line; count the targets that named a failed test.
          named=$(awk '/^ *(Running|Doc-tests) / { target = $0 } /^test [A-Za-z0-9_:]+ \.\.\. FAILED$/ { seen[target] = 1 }
            END { n = 0; for (t in seen) n++; print n }' "$log.lf")
          targets=$(grep -c '^error: test failed, to rerun pass' "$log.lf" || true)
          echo "failed tests: ${#failed[@]} (${failed[*]}); failed targets: $targets, with a named test: $named"
          if [ "${#failed[@]}" -eq 0 ] || [ "${#failed[@]}" -gt 3 ] || [ "$targets" -ne "$named" ]; then
            echo "not a flake: rerunning nothing"
            exit 1
          fi
          for name in "${failed[@]}"; do
            for attempt in 1 2 3; do
              out=$RUNNER_TEMP/test/rerun-${name//::/__}-$attempt.txt
              # The same command, profile, target and environment as above, so cargo reuses the built test binaries;
              # `--tests` leaves out the doctests, which would compile again. `--exact` runs that test alone in every
              # binary that has it.
              status=0
              "${run[@]}" --tests -- "$name" --exact 2>&1 | tee "$out" || status=$?
              if [ "$status" -ne 0 ] || ! tr -d '\r' < "$out" | sed -E 's/\x1b\[[0-9;]*m//g' | grep -qxF "test $name ... ok"; then
                echo "$name failed rerun $attempt of 3 (exit $status)"
                exit 1
              fi
            done
          done
          {
            echo '### Flaky on Windows'
            echo 'Each failed in the full run and passed three reruns alone, so the release goes on:'
            # shellcheck disable=SC2016 # Markdown code spans, not expansions
            printf -- '- `%s`\n' "${failed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        name: Summary
        run: |
          f=$RUNNER_TEMP/test/cargo-test.txt
          [ -f "$f" ] || exit 0
          {
            echo '### cargo test on Windows'
            grep -E '^test result:|^error: test failed|^    [A-Za-z0-9_:]+$' "$f" || true
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: ${{ runner.temp }}/test/
          if-no-files-found: ignore

  # Only main publishes; a branch's run stops before this job. An optional target that failed has uploaded no dist-*,
  # so its archive is left out.
  release:
    needs: [plan, advisories, build, windows, windows-test]
    if: needs.plan.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      DEV_BASE: ${{ needs.plan.outputs.dev_base }}
      OPENTUI_TAG: ${{ needs.plan.outputs.opentui_tag }}
      OPENTUI_REV: ${{ needs.plan.outputs.opentui_rev }}
      HEADER: ${{ needs.plan.outputs.header_fnv1a64 }}
      REF: ${{ inputs.ref || 'native-next' }}
      VERSION: ${{ needs.plan.outputs.version }}
      ZIG_VERSION: ${{ needs.plan.outputs.zig_version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          set -euo pipefail
          cd dist
          jq -n \
            --arg version "$VERSION" --arg ref "$REF" --arg commit "$COMMIT" --arg dev_base "$DEV_BASE" \
            --arg tag "$OPENTUI_TAG" --arg rev "$OPENTUI_REV" --arg header "$HEADER" --arg rust "$RUST_VERSION" --arg zig "$ZIG_VERSION" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson assets "$(ls | jq -R . | jq -s .)" \
            '{version: $version, binary: "opencode-native",
              opencode: {repository: "anomalyco/opencode", ref: $ref, commit: $commit, dev_base: $dev_base},
              opentui: ({repository: "anomalyco/opentui"} + (if $tag == "" then {} else {tag: $tag} end)
                + {rev: $rev, header_fnv1a64: $header}),
              toolchain: {rust: $rust, zig: $zig, profile: "dist"},
              bundles: {opencode: {version: $version, channel: "latest", built_from: $commit}},
              run: $run, assets: $assets}' > manifest.json
          sha256sum -- * > SHA256SUMS
          cat manifest.json SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Prerelease
        run: |
          set -euo pipefail
          short=${COMMIT:0:10}
          opentui="[\`${OPENTUI_REV:0:10}\`](https://github.com/anomalyco/opentui/commit/$OPENTUI_REV)"
          if [ -n "$OPENTUI_TAG" ]; then
            opentui="[\`$OPENTUI_TAG\`](https://github.com/anomalyco/opentui/releases/tag/$OPENTUI_TAG) ($opentui)"
          fi
          cat > notes.md <<EOF
          Preview build of \`opencode-native\`, the OpenCode native CLI, from [\`anomalyco/opencode@$short\`](https://github.com/anomalyco/opencode/commit/$COMMIT) (\`$REF\`; \`dev\` base [\`${DEV_BASE:0:10}\`](https://github.com/anomalyco/opencode/commit/$DEV_BASE)), OpenTUI $opentui.

          Unsigned preview. Each archive holds \`opencode-native\` and the TypeScript \`opencode\` server it runs, built from the same commit at the same version; nothing else needs to be installed. Install or update:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash
          \`\`\`

          Verify: \`sha256sum -c SHA256SUMS --ignore-missing\` and \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`.
          EOF
          # GITHUB_TOKEN cannot create a tag at a commit whose workflow files differ from the default branch (that needs
          # the workflows permission; the API answers 403 "Resource not accessible by integration"). When main moved
          # on during the run, tag main's head and name the workflow commit in the notes.
          target=$GITHUB_SHA
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            target=$head
            printf '\nBuilt by the workflow at %s; tagged at %s, the head of %s when it finished.\n' \
              "$GITHUB_SHA" "$head" "$GITHUB_REF_NAME" >> notes.md
          fi
          gh release create "v$VERSION" dist/* -R "$GITHUB_REPOSITORY" --target "$target" \
            --prerelease --title "opencode-native $VERSION" --notes-file notes.md
